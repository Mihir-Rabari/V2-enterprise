# V2 Enterprise — nginx site config (Cloudflare → nginx → PM2)
#
#   /api/*, /videos/*, /sliders/*  → backend  (PM2 'v2-app',      127.0.0.1:5000)
#   everything else (/)            → frontend (PM2 'v2-frontend', 127.0.0.1:3001)
#
# Public URLs are unchanged, so existing Cloudflare cache rules keep matching.
# Keep your existing `listen` / `ssl_certificate*` lines if the origin uses a
# Cloudflare origin cert on 443 — only the location blocks below are new.
#
# Install:  sudo cp deploy/nginx/v2enterprise.conf /etc/nginx/sites-available/v2enterprise
#           sudo nginx -t && sudo systemctl reload nginx

upstream v2_backend  { server 127.0.0.1:5000; keepalive 16; }
upstream v2_frontend { server 127.0.0.1:3001; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name v2enterprise.in www.v2enterprise.in;

    # Admin uploads (videos, slider media) go through the API — Express allows 500mb.
    client_max_body_size 500M;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CF-Connecting-IP is passed through untouched; the backend rate limiter keys on it.

    location /api/ {
        proxy_pass http://v2_backend;
        proxy_read_timeout 300s;   # large uploads / slow admin requests
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location /videos/  { proxy_pass http://v2_backend; }
    location /sliders/ { proxy_pass http://v2_backend; }

    location / {
        proxy_pass http://v2_frontend;
    }
}
