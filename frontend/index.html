<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ────────────────────────────────────────────────────── -->
  <title>V2 Enterprise — Premium Luxury Fashion</title>
  <meta name="description" content="Discover V2 Enterprise's exclusive collection of premium menswear and luxury fashion. Crafted with care in Bhavnagar, Gujarat. Shop kurtas, shirts, and more." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://v2enterprise.in/" />

  <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ─────────────────────── -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="V2 Enterprise" />
  <meta property="og:title" content="V2 Enterprise — Premium Luxury Fashion" />
  <meta property="og:description" content="Exclusive premium menswear and luxury fashion from Bhavnagar, Gujarat. Shop V2 Enterprise's curated collections." />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:url" content="https://v2enterprise.in/" />

  <!-- ── Twitter / X Card ──────────────────────────────────────────────── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="V2 Enterprise — Premium Luxury Fashion" />
  <meta name="twitter:description" content="Exclusive premium menswear and luxury fashion, crafted with care." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- ── Brand & PWA ───────────────────────────────────────────────────── -->
  <meta name="theme-color" content="#0A0A0B" />
  <link rel="icon" type="image/webp" href="/v2_logo.webp" />

  <!-- ── Performance Hints ──────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://ik.imagekit.io" />
  <link rel="dns-prefetch" href="https://ik.imagekit.io" />
  <link rel="preconnect" href="https://v2enterprise.cloud" />
  <link rel="dns-prefetch" href="https://v2enterprise.cloud" />

  <!-- ── Google Fonts — preconnect first, then slimmed weights ─────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" />
  </noscript>

  <!-- ── Suppress React DevTools warning in production ─────────────────── -->
  <script>
    if (typeof window !== 'undefined') {
      window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = { isDisabled: true };
    }
  </script>

  <!-- ── Meta Pixel ────────────────────────────────────────────────────── -->
  <script>
    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return; n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments)
      };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
      n.queue = []; t = b.createElement(e); t.async = !0;
      t.src = v; s = b.getElementsByTagName(e)[0];
      if (s && s.parentNode) {
        s.parentNode.insertBefore(t, s);
      } else {
        document.head.appendChild(t);
      }
    }(window, document, 'script',
      'https://connect.facebook.net/en_US/fbevents.js');
    if (window.fbq) {
      fbq('init', '1887679655474555');
      fbq('track', 'PageView');
    }
  </script>
  <!-- NOTE: Razorpay is now loaded lazily inside Checkout.tsx only -->
</head>

<body class="bg-white text-gray-900">
  <!-- Meta Pixel noscript fallback -->
  <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1887679655474555&ev=PageView&noscript=1" /></noscript>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
